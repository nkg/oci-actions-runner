schemaVersion: 2.0.0

# Running these LOCALLY on an Apple Silicon Mac: build and test the NATIVE
# arch. Under colima the VM is aarch64, so `--platform linux/amd64` runs
# through QEMU, and Go binaries (gh, mise) crash there roughly four times
# in five with `fatal error: found pointer to free object`. That is a
# qemu-user/Go problem, not a defect in the image — verified 5/5 native
# vs 1/5 emulated for the same binary. CI runs on real amd64 and is not
# affected. A "failure" here that is a Go runtime panic is the emulator.

# Verify the image's runtime contract — the things gha-nomad-dispatcher
# and downstream operators assume are true when they spawn a container
# from this image.

commandTests:
  - name: bash present
    command: bash
    args: ["--version"]
    expectedOutput: ["GNU bash"]

  - name: docker CLI on PATH
    command: docker
    args: ["--version"]
    expectedOutput: ["Docker version"]

  - name: git present (actions/checkout requirement)
    command: git
    args: ["--version"]
    expectedOutput: ["git version"]

  - name: jq present (used by most workflows)
    command: jq
    args: ["--version"]
    expectedOutput: ["jq-"]

  # The Nomad runner pool runs this image directly, so anything a workflow
  # assumes is present has to be asserted here — there is no derived layer
  # to catch it, and the failure surfaces in the consumer's repo as a
  # first-step error with no local explanation.
  - name: gh present (PR comments, releases, App tokens)
    command: gh
    args: ["--version"]
    expectedOutput: ["gh version"]

  - name: python3 present
    command: python3
    args: ["--version"]
    expectedOutput: ["Python 3"]

  # Asserted ABSENT on purpose. build-essential is a toolchain, which is
  # what this image asks operators to layer on themselves, and it is
  # ~200 MB. If someone adds it, this fails and they have to justify it in
  # the README rather than quietly growing every consumer's pull.
  - name: build-essential is deliberately absent
    command: bash
    args: ["-c", "command -v gcc >/dev/null && echo FOUND || echo NOT_FOUND"]
    expectedOutput: ["NOT_FOUND"]

  - name: openssh client present (checkout-over-SSH workflows)
    command: ssh
    args: ["-V"]
    expectedError: ["OpenSSH"]

  - name: tini is the init
    command: /usr/bin/tini
    args: ["--version"]
    expectedOutput: ["tini version"]

  # The EXACT version, not a loose pattern. A `\d+\.\d+`-style match
  # here is what let an unpinned mise drift across rebuilds while the
  # test stayed green — it asserted "some mise", which was never in
  # doubt. Bumping MISE_VERSION in the Dockerfile must fail this test
  # until it is edited too, so the pin cannot move by accident.
  - name: mise present at the pinned version
    command: mise
    args: ["--version"]
    expectedOutput: ["2026\\.9\\.1 linux-"]

  # /mise is created root-owned and handed to the runner user in the
  # Dockerfile. Without that chown the image still builds, still passes
  # `mise --version`, and fails the first real job with EACCES.
  - name: mise data dir is writable by the runner user
    command: bash
    args: ["-c", "touch /mise/.probe && echo MISE_DIR_WRITABLE"]
    expectedOutput: ["MISE_DIR_WRITABLE"]

  # Shims must PRECEDE the system bins, not merely appear on PATH:
  # a job that installs its own node expects that node to win over any
  # system one. Downstream images inherit this ordering.
  - name: mise shims come first on PATH
    command: bash
    args: ["-c", 'case "$PATH" in /mise/shims:*) echo SHIMS_FIRST;; *) echo "PATH=$PATH";; esac']
    expectedOutput: ["SHIMS_FIRST"]

  # These assert on a distinctive token rather than on the raw output.
  # container-structure-test matches with Go regexp, where `$` anchors
  # to end-of-TEXT, not end-of-line — so `^0$` never matches a command
  # whose output is "0\n". That made an earlier `excludedOutput:
  # ["^0$"]` check vacuous: it passed whether or not the thing it
  # guarded was true. Emitting an explicit token keeps the assertion
  # honest regardless of trailing whitespace.

  # The README promises passwordless sudo. The package was previously
  # installed with no sudoers entry, so `sudo` failed for the runner
  # user — documented behaviour that didn't exist. `-n` fails rather
  # than prompting, so this asserts NOPASSWD specifically, and the uid
  # comparison proves it actually reached root.
  - name: runner has passwordless sudo
    command: bash
    args: ["-c", 'test "$(sudo -n id -u)" = 0 && echo SUDO_IS_ROOT']
    expectedOutput: ["SUDO_IS_ROOT"]

  # The runner agent is .NET and won't start without ICU. The package
  # name changes with every Debian ICU bump, so this guards the
  # build-time resolution rather than a hardcoded version.
  - name: ICU runtime present for the .NET-based runner agent
    command: bash
    args: ["-c", "ldconfig -p | grep -q libicuuc && echo ICU_PRESENT"]
    expectedOutput: ["ICU_PRESENT"]

  # Only one init should be installed. dumb-init was carried alongside
  # tini for a while, unused and undocumented as such.
  - name: dumb-init is not installed
    command: bash
    args: ["-c", "command -v dumb-init >/dev/null && echo FOUND || echo NOT_FOUND"]
    expectedOutput: ["NOT_FOUND"]

fileExistenceTests:
  - name: entrypoint installed
    path: /usr/local/bin/entrypoint.sh
    shouldExist: true
    permissions: -rwxr-xr-x

  # sudo refuses to run at all if any sudoers file is group- or
  # world-writable, so the mode is part of the contract, not a detail.
  - name: sudoers drop-in has the mode sudo requires
    path: /etc/sudoers.d/runner
    shouldExist: true
    permissions: -r--r-----

  - name: runner agent installed
    path: /home/runner/runner/config.sh
    shouldExist: true

  - name: runner agent run script installed
    path: /home/runner/runner/run.sh
    shouldExist: true

  - name: work dir exists
    path: /home/runner/_work
    shouldExist: true
    isExecutableBy: owner

metadataTest:
  user: "runner"
  workdir: "/home/runner"
  entrypoint:
    - "/usr/bin/tini"
    - "--"
    - "/usr/local/bin/entrypoint.sh"
  labels:
    - key: "org.opencontainers.image.source"
      value: "https://github.com/nkg/oci-actions-runner"
    - key: "org.opencontainers.image.licenses"
      value: "MIT"
