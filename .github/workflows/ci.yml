name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck entrypoint.sh tests/*.sh

  entrypoint-shutdown:
    name: entrypoint shutdown path
    # Needs a real procfs (the watchdog scans /proc for Runner.Worker)
    # but no docker: the entrypoint shells out to config.sh and run.sh,
    # so stubbing those is enough. Runs beside the linters rather than
    # after the image build for that reason.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tests/entrypoint-shutdown-test.sh
      # Socket-group block: stubbed sudo and a real unix socket, still no
      # docker. Kept beside the shutdown test since both drive the same
      # entrypoint against stub config.sh/run.sh.
      - run: tests/entrypoint-socket-test.sh

  build-and-test:
    name: build + container-structure-test
    runs-on: ubuntu-latest
    needs: [hadolint, shellcheck]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (load locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: oci-actions-runner:ci
          # Single arch on CI to keep build time reasonable; release
          # workflow does multi-arch.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install container-structure-test
        run: |
          curl -fsSL -o /tmp/cst \
            https://storage.googleapis.com/container-structure-test/latest/container-structure-test-linux-amd64
          chmod +x /tmp/cst
          sudo mv /tmp/cst /usr/local/bin/container-structure-test

      - name: Run container-structure-test
        run: |
          container-structure-test test \
            --image oci-actions-runner:ci \
            --config tests/container-structure-test.yaml

  pr-title:
    name: PR title is conventional
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            ci
            docs
            test
            refactor
            perf
          requireScope: false
